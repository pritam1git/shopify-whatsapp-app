# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f116721608d775c3e8d81c83a9ebaa36"
name = "WHATSAPP CHAT"
application_url = "https://apps.revinfotech.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-01"

# ✅ Webhooks subscriptions with URI
[[webhooks.subscriptions]]
topic = "customers/data_request"
uri = "https://apps.revinfotech.com/webhooks/customers/data_request"
format = "json"
compliance_topics = ["customers/data_request"]

[[webhooks.subscriptions]]
topic = "customers/redact"
uri = "https://apps.revinfotech.com/webhooks/customers/redact"
format = "json"
compliance_topics = ["customers/redact"]

[[webhooks.subscriptions]]
topic = "shop/redact"
uri = "https://apps.revinfotech.com/webhooks/shop/redact"
format = "json"
compliance_topics = ["shop/redact"]

[access_scopes]
scopes = "read_products,write_products,read_script_tags,write_script_tags,read_customers"

[auth]
redirect_urls = [
  "https://apps.revinfotech.com/auth/callback"
]

# ✅ Add this section for your theme extension
[[extensions]]
type = "theme"
name = "WhatsApp Chat"
handle = "whatsapp_chat"
path = "extensions/whatsapp_chat"
